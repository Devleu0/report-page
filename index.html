<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <a href="#home" data-lang-key="logo_text">Portfolio</a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="#about" data-lang-key="nav_about">About</a></li>
                <li><a href="#projects" data-lang-key="nav_projects">Projects</a></li>
                <li><a href="#skills" data-lang-key="nav_skills">Skills</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <div class="lang-switcher">
                <button id="lang-ko" class="active" aria-pressed="true">KR</button>
                <button id="lang-ja" aria-pressed="false">JP</button>
            </div>
            <button class="menu-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <main class="container">
        <section id="home" class="home-section">
            <div class="system-meta">
                <p class="log-line">SESSION_ID: 20260811-CL4_KR</p>
                <p class="log-line">STATUS: Connection established. Portfolio v2.0 Active.</p>
            </div>
            <h1 data-lang-key="main_title"></h1>
            <p class="subtitle" data-lang-key="main_subtitle"></p>
        </section>

        <section id="about" class="section">
            <h2 data-lang-key="about_title"></h2>
            <p data-lang-key="about_p1"></p>
            <p data-lang-key="about_p2"></p>
        </section>

        <section id="projects" class="section">
            <h2 data-lang-key="projects_title"></h2>
            <div class="project-grid">
                <!-- Project 1 -->
                <div class="project-card">
                    <div class="project-header">
                        <span class="project-type" data-lang-key="project1_type"></span>
                        <h3 data-lang-key="project1_title"></h3>
                    </div>
                    <div class="project-body">
                        <p data-lang-key="project1_desc"></p>
                    </div>
                    <div class="project-footer">
                        <div class="badge-container">
                            <span class="badge">WordPress</span>
                            <span class="badge">CSS3</span>
                            <span class="badge">JS</span>
                            <span class="badge">AI-Assisted</span>
                        </div>
                    </div>
                </div>
                <!-- Project 2 -->
                <div class="project-card">
                    <div class="project-header">
                        <span class="project-type" data-lang-key="project2_type"></span>
                        <h3 data-lang-key="project2_title"></h3>
                    </div>
                    <div class="project-body">
                        <p data-lang-key="project2_desc"></p>
                    </div>
                    <div class="project-footer">
                        <div class="badge-container">
                            <span class="badge">Fieldwork</span>
                            <span class="badge">UX Research</span>
                            <span class="badge">Data Analysis</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="skills" class="section">
            <h2 data-lang-key="skills_title"></h2>
            <div class="skill-card-container">
                <div class="skill-card">
                    <h4 data-lang-key="skill1_title"></h4>
                    <p data-lang-key="skill1_desc"></p>
                </div>
                <div class="skill-card">
                    <h4 data-lang-key="skill2_title"></h4>
                    <p data-lang-key="skill2_desc"></p>
                </div>
                <div class="skill-card">
                    <h4 data-lang-key="skill3_title"></h4>
                    <p data-lang-key="skill3_desc"></p>
                </div>
                <div class="skill-card">
                    <h4 data-lang-key="skill4_title"></h4>
                    <p data-lang-key="skill4_desc"></p>
                </div>
            </div>
        </section>


    </main>

    <footer class="footer">
        <p data-lang-key="footer_text"></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
